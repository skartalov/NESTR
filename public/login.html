<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NESTR – Access</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><h1>NESTR <span>ceramic tile nesting for CNC knife cutting</span></h1></header>
<main style="max-width:420px">
  <form id="f" class="panel">
    <h2>Access code</h2>
    <label>Enter your access code
      <input id="code" type="password" autocomplete="current-password" autofocus required style="width:100%;padding:8px;font-size:16px;margin-top:6px">
    </label>
    <div class="actions"><button type="submit">Enter</button></div>
    <div id="error" class="error"></div>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
